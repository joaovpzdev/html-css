<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário estilizado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Crie Uma Conta</h2>
    </header>

    <form class="form-container" action="sucess.html" method="POST">
        <div class="form-row">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>
        <div class="form-row">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>
        </div>
        <div class="form-row"   >
            <label for="senha" class="form-label">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
        </div>
        <div class="form-row">
            <label for="birthDate" class="form-label">Data de Nascimento:</label>
            <input type="date" id="birthDate" name="birthDate" placeholder="Selecione sua data de nascimento" required>
        </div>
        <div class="form-row">
            <label for="genero" class="form-label">Gênero:</label>
            <select id="genero" name="genero" required>
                <option value="">Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select>
        </div>
        <div class="form-row">
            <label for="termos" class="form-small-label">
                <input type="checkbox" id="termos" name="termos" required>
                Aceito os termos e condições
            </label>
        </div>

        <div class="form-row">
            <input type="submit" value="Criar Conta" class="form-button">
        </div>
    </form>

</body>
</html>
