<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 50%;
            border: 1px solid black;
        }
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        tr.linha {
            background-color: yellow;
        }
        td.dado {
            background-color: lightblue;
        }
        td.dado2 {
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Minha primeria tabela</h1>
    <!-- A hierarquia de tabelas simples
          table row = linha da tabela
          table header = cabeçalho da tabela
          table data = dados da tabela
    -->
    <table>
        <tr> <!-- table row primeira linha -->
            <td class="dado">A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td class="dado2">B2</td>
            <td class="dado">C2</td>
        </tr>
        <tr class="linha">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td> 
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td class="dado">C4</td>

        </tr>
        <tr>
            <td>A5</td>
            <td>B5</td>
            <td class="dado">C5</td>
        </tr>

    </table>
    
</body>
</html>
