<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Start FullStackClub Formulário</title>
</head>
<body>
    <form action="https://formspree.io/f/mnqvkwqv" method="POST">
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="_replyto" required>
        <br><br>
        <label for="password">Senha:</label>
        <input id="password" type="password" minlength="9" name="password" required>
        <br><br>
        <label for="message">Mensagem:</label>
        <textarea id="message" name="message" required></textarea>
        <br><br>
        <label for="gender"></label>Gênero:</label>
        <select id="gender" name="gender" required>
             <option value="Selecione">Selecione</option>
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select>
        <br><br>
        <div>
        <label for="Dog">Cachorro</label>
        <input type="checkbox" id="Dog" name="pet" value="Dog">
        <label for="Cat">Gato</label>
        <input type="checkbox" id="Cat" name="pet" value="Cat">
        </div>
        <br><br>
        <button type="submit">Enviar</button>
    
</body>
</html>
